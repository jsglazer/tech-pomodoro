# XcodeGen spec — source of truth for TechPomodoro.xcodeproj: the macOS menu-bar app, the iOS app,
# and the iOS app's Live Activity extension. Core domain logic stays in the SwiftPM package
# (Package.swift) as the TechPomodoroCore library module; both app targets compile only their own
# shell sources and link that library, so `import TechPomodoroCore` resolves to the same module the
# headless test suite builds against. MARKETING_VERSION is shared, so macOS and iOS version together.
# Regenerate with:  xcodegen generate
name: TechPomodoro
options:
  bundleIdPrefix: com.jsglazer
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.21"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "PWGXN26URQ"
    SWIFT_VERSION: "6.0"

packages:
  TechPomodoroCore:
    path: .

targets:
  TechPomodoro:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/TechPomodoroApp
    dependencies:
      - package: TechPomodoroCore
        product: TechPomodoroCore
      - package: TechPomodoroCore
        product: TechPomodoroSync
    entitlements:
      path: Sources/TechPomodoroApp/TechPomodoro.entitlements
      properties:
        # iCloud sync (TechPomodoroSync). Production on every build, so the Developer ID Mac app
        # and the Xcode-installed iPhone app read and write the same CloudKit database.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jsglazer.tech-pomodoro
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Production
        # Document sensor: read the folder in ForkLift's active tab over Apple Events (hardened runtime).
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: TechPomodoro
        PRODUCT_BUNDLE_IDENTIFIER: com.jsglazer.tech-pomodoro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TechPomodoro
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "TechPomodoro reads the folder shown in ForkLift so Focus can tell when you are working in a class folder."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Josh Glazer"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TechPomodoroiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/TechPomodoroiOS
      - path: Sources/TechPomodoroShared
    dependencies:
      - package: TechPomodoroCore
        product: TechPomodoroCore
      - package: TechPomodoroCore
        product: TechPomodoroSync
      - target: TechPomodoroLiveActivity
        embed: true
    entitlements:
      path: Sources/TechPomodoroiOS/TechPomodoroiOS.entitlements
      properties:
        # Boundary alerts break through Focus, as a timer's should.
        com.apple.developer.usernotifications.time-sensitive: true
        # Live Activity push-to-start, so a Mac can mirror its timer here. Xcode signs a development
        # build with this as is (sandbox APNs) and rewrites it to production for an App Store export.
        aps-environment: development
        # iCloud sync (TechPomodoroSync). Production on every build, so the Developer ID Mac app
        # and the Xcode-installed iPhone app read and write the same CloudKit database.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jsglazer.tech-pomodoro
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Production
    settings:
      base:
        PRODUCT_NAME: TechPomodoro
        PRODUCT_BUNDLE_IDENTIFIER: com.jsglazer.tech-pomodoro.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pomodoro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Josh Glazer"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # The Mac mirror sends a high-priority push on every change; this raises the system's update budget.
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"

  TechPomodoroLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/TechPomodoroLiveActivity
      - path: Sources/TechPomodoroShared
      # The palette only; the token mapping (Theme+Tokens.swift) needs the core and stays in the app.
      - path: Sources/TechPomodoroiOS/Theme.swift
    info:
      path: Sources/TechPomodoroLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Pomodoro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TechPomodoroLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.jsglazer.tech-pomodoro.ios.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
